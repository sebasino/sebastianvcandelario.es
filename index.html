  <style>
    :root{
      --bg:#f6fbf8;
      --card:#ffffff;
      --accent:#16a34a;
      --accent-2:#059669;
      --muted:#5b6b68;
      --shadow:0 6px 24px rgba(0,0,0,0.08);
      --radius:14px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Inter,Arial;
      background:var(--bg);
      color:#0f1724;
    }

    /* NAVBAR */
    nav{
      width:100%;
      padding:18px 32px;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:var(--shadow);
      position:sticky;
      top:0;
      z-index:20;
    }
    nav .brand{
      font-weight:800;
      font-size:20px;
      color:var(--accent-2);
    }
    nav .links a{
      margin-left:20px;
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:8px 12px;
      border-radius:10px;
    }
    nav .links a:hover{
      background:rgba(5,150,105,0.08);
      color:var(--accent-2);
    }

    /* HERO */
    .hero{
      max-width:1100px;
      margin:60px auto;
      padding:32px;
      text-align:center;
    }
    .hero h1{
      font-size:46px;
      font-weight:800;
      color:#053322;
    }
    .hero p{
      margin-top:16px;
      font-size:18px;
      color:var(--muted);
    }

    .btn{
      display:inline-block;
      margin-top:24px;
      padding:12px 22px;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:white;
      border-radius:12px;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 6px 18px rgba(6,95,70,0.12);
    }

    footer{
      text-align:center;
      margin-top:60px;
      padding:20px;
      color:var(--muted);
      font-size:14px;
    }
    /* --- Responsive layout for mobiles --- */
@media (max-width: 768px) {
  /* Navbar: apilar nombre y links, reducir espacios */
  nav {
    flex-direction: column;
    align-items: flex-start;
    padding: 12px 16px;
  }

  nav .brand {
    margin-bottom: 8px;
    font-size: 18px;
  }

  nav .links a {
    margin-left: 0;
    margin-right: 10px;
    padding: 6px 10px;
    font-size: 14px;
  }

  /* Hero: menos márgenes y texto más pequeño */
  .hero {
    margin: 32px auto 24px auto;
    padding: 20px;
  }

  .hero h1 {
    font-size: 30px;
  }

  .hero p {
    font-size: 16px;
  }

  .btn {
    width: 100%;
    max-width: 260px;
  }
