<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sebastián Valentín Candelario — Home</title>
  <meta name="description" content="Portfolio of Sebastián V. Candelario — Environmental Plant & Energy Engineer." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6fbf8;
      --card:#ffffff;
      --accent:#16a34a;
      --accent-2:#059669;
      --muted:#5b6b68;
      --shadow:0 6px 24px rgba(0,0,0,0.08);
      --radius:14px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Inter,Arial;
      background:var(--bg);
      color:#0f1724;
    }

    /* NAVBAR */
    nav{
      width:100%;
      padding:18px 32px;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:var(--shadow);
      position:sticky;
      top:0;
      z-index:20;
    }
    nav .brand{
      font-weight:800;
      font-size:20px;
      color:var(--accent-2);
    }
    nav .links a{
      margin-left:20px;
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:8px 12px;
      border-radius:10px;
    }
    nav .links a:hover{
      background:rgba(5,150,105,0.08);
      color:var(--accent-2);
    }

    /* HERO */
    .hero{
      max-width:1100px;
      margin:60px auto;
      padding:32px;
      text-align:center;
    }
    .hero h1{
      font-size:46px;
      font-weight:800;
      color:#053322;
    }
    .hero p{
      margin-top:16px;
      font-size:18px;
      color:var(--muted);
    }

    .btn{
      display:inline-block;
      margin-top:24px;
      padding:12px 22px;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:white;
      border-radius:12px;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 6px 18px rgba(6,95,70,0.12);
    }

    footer{
      text-align:center;
      margin-top:60px;
      padding:20px;
      color:var(--muted);
      font-size:14px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR WITH REAL PAGE LINKS -->
  <nav>
    <div class="brand">Sebastián Valentín Candelario</div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/education/">Education</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>Environmental Plant & Energy Engineer</h1>
    <p>Specialized in sustainable industrial systems, process simulation, and low-carbon energy solutions.</p>
    <a class="btn" href="/projects/">Explore Projects</a>
  </section>

  <footer>
    © <span id="year"></span> Sebastián Valentín Candelario — All rights reserved
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
