<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Sebastián Valentín Candelario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6fbf8;
      --card:#ffffff;
      --accent:#16a34a;
      --accent-2:#059669;
      --muted:#5b6b68;
      --shadow:0 6px 24px rgba(0,0,0,0.08);
      --radius:14px;
    }

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:var(--bg);
      color:#0f1724;
    }

    /* NAVBAR */
    nav{
      width:100%;
      padding:14px 18px;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      box-shadow:var(--shadow);
      position:sticky;
      top:0;
      z-index:20;
      box-sizing:border-box;
    }

    nav .brand{
      font-weight:800;
      font-size:20px;
      color:var(--accent-2);
      text-decoration:none;
    }

    nav .links{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
    }

    nav .links a{
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:6px 10px;
      border-radius:10px;
      font-size:14px;
    }

    nav .links a:hover{
      background:rgba(5,150,105,0.08);
      color:var(--accent-2);
    }

    /* Responsive navbar */
    @media (max-width: 768px) {
      nav {
        padding:10px 14px;
        align-items:flex-start;
      }

      nav .brand {
        margin-bottom:6px;
        font-size:18px;
      }

      nav .links {
        justify-content:flex-start;
      }
    }

    /* CONTACT SECTION */
    .contact-container {
      max-width: 700px;
      margin: 60px auto;
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      box-sizing: border-box;
    }

    .contact-title {
      font-size: 32px;
      font-weight: 800;
      color: #053322;
      text-align: center;
      margin-bottom: 10px;
    }

    .contact-subtitle {
      text-align: center;
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-form label {
      font-weight: 600;
      color: var(--muted);
    }

    .contact-form input,
    .contact-form textarea {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(5,150,105,0.15);
      background: #ffffff;
      font-size: 14px;
      font-family: Inter, Arial, sans-serif;
      color: #0f1724;
      box-sizing: border-box;
    }

    .contact-btn {
      margin-top: 10px;
      padding: 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .contact-btn:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a class="brand" href="/">Sebastián Valentín Candelario</a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/about-me/">About Me</a>
      <a href="/education/">Education</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </div>
  </nav>

  <!-- CONTACT SECTION -->
  <section class="contact-container">
    <h1 class="contact-title">Contact</h1>
    <p class="contact-subtitle">
      If you want to collaborate, have any questions, or need information about a project,
      feel free to send me a message using this form.
    </p>

    <!-- FORMSPREE FORM -->
 
    <form 
  action="https://formspree.io/f/mdkjkzop"
  method="POST"
  class="contact-form"
>
  <!-- Nombre -->
  <label>Your name</label>
  <input type="text" name="name" required>

  <!-- Email -->
  <label>Your email</label>
  <input type="email" name="email" required>

  <!-- Mensaje -->
  <label>Your message</label>
  <textarea name="message" rows="4" required></textarea>

  <!-- Asunto opcional -->
  <input type="hidden" name="_subject" value="New message from portfolio">

  <button type="submit" class="contact-btn">Send message</button>
</form>

  </section>

</body>
</html>
