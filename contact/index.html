<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Sebastián Valentín Candelario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
  

    :root{
      --bg:#f6fbf8;
      --card:#ffffff;
      --accent:#16a34a;
      --accent-2:#059669;
      --muted:#5b6b68;
      --shadow:0 6px 24px rgba(0,0,0,0.08);
      --radius:14px;
    }

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:var(--bg);
      color:#0f1724;
    }

    /* NAVBAR */
    nav{
      width:100%;
      padding:18px 32px;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:var(--shadow);
      position:sticky;
      top:0;
      z-index:20;
    }

    nav .brand{
      font-weight:800;
      font-size:20px;
      color:var(--accent-2);
    }

    nav .links{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
    }

    nav .links a{
      margin-left:20px;
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:8px 12px;
      border-radius:10px;
    }

    nav .links a:hover{
      background:rgba(5,150,105,0.08);
      color:var(--accent-2);
    }

    /* TITLE */
    h1{
      font-size:32px;
      font-weight:800;
      color:#053322;
      text-align:center;
      margin-top:40px;
    }

    /* Responsive navbar */
    @media (max-width: 768px) {
      nav {
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
      }

      nav .brand {
        margin-bottom: 8px;
        font-size: 18px;
      }

      nav .links a {
        margin-left: 0;
        margin-right: 10px;
        margin-top: 4px;
        font-size: 14px;
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="brand">Sebastián Valentín Candelario</div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/about-me/">About Me</a>
      <a href="/education/">Education</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </div>
  </nav>

  <!-- PAGE TITLE -->
  <h1>Contact</h1>

  <!-- PAGE CONTENT -->
  <p style="text-align:center; margin-top:40px; font-size:25px; color:#5b6b68;">
    This section is in progress. New content will be added soon :)
  </p>

</body>
</html>
