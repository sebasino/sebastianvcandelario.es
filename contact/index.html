<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Sebastián Valentín Candelario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#020617;
      --bg-soft:#0b1220;
      --card:rgba(15,23,42,0.96);
      --accent:#16a34a;
      --accent-2:#22c55e;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --shadow:0 18px 45px rgba(0,0,0,0.55);
      --radius:14px;
    }

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:radial-gradient(circle at top,#052e16 0,#020617 55%);
      color:var(--text);
    }

    /* NAVBAR */
    nav{
      width:100%;
      padding:14px 18px;
      background:rgba(2,6,23,0.92);
      backdrop-filter:blur(12px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      border-bottom:1px solid rgba(148,163,184,0.25);
      position:sticky;
      top:0;
      z-index:20;
      box-sizing:border-box;
    }

    nav .brand{
      font-weight:800;
      font-size:20px;
      color:var(--accent-2);
      text-decoration:none;
      text-shadow:0 0 8px rgba(34,197,94,0.4);
    }

    nav .links{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }

    nav .links a{
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:6px 12px;
      border-radius:999px;
      font-size:14px;
      transition:0.2s ease;
    }

    nav .links a:hover{
      background:rgba(34,197,94,0.15);
      color:var(--text);
    }

    /* Responsive navbar */
    @media (max-width: 768px) {
      nav {
        padding:10px 14px;
        align-items:flex-start;
      }

      nav .brand {
        margin-bottom:6px;
        font-size:18px;
      }

      nav .links {
        justify-content:flex-start;
      }
    }

    /* CONTACT SECTION */
    .contact-container {
      max-width: 700px;
      margin: 60px auto;
      background: var(--card);
      padding: 40px 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      box-sizing: border-box;
      border:1px solid rgba(148,163,184,0.35);
      backdrop-filter:blur(18px);
    }

    .contact-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent-2);
      text-align: center;
      margin-bottom: 10px;
      text-shadow:0 0 12px rgba(34,197,94,0.45);
    }

    .contact-subtitle {
      text-align: center;
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-form label {
      font-weight: 600;
      color: var(--muted);
      font-size:14px;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.5);
      background: #020617;
      font-size: 14px;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      box-sizing: border-box;
      outline:none;
    }

    .contact-form input:focus,
    .contact-form textarea:focus{
      border-color:var(--accent-2);
      box-shadow:0 0 0 1px rgba(34,197,94,0.5);
    }

    .contact-btn {
      margin-top: 10px;
      padding: 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .contact-btn:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a class="brand" href="/">Sebastián Valentín Candelario</a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/about-me/">About Me</a>
      <a href="/education/">Education</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </div>
  </nav>

  <!-- CONTACT SECTION -->
  <section class="contact-container">
    <h1 class="contact-title">Contact</h1>
    <p class="contact-subtitle">
      If you want to collaborate, have any questions, or need information about a project,
      feel free to send me a message using this form.
    </p>

    <!-- FORMSPREE FORM -->
    <form 
      action="https://formspree.io/f/mdkjkzop"
      method="POST"
      class="contact-form"
    >
      <!-- Nombre -->
      <label>Your name</label>
      <input type="text" name="name" required>

      <!-- Email -->
      <label>Your email</label>
      <input type="email" name="email" required>

      <!-- Mensaje -->
      <label>Your message</label>
      <textarea name="message" rows="4" required></textarea>

      <!-- Asunto opcional -->
      <input type="hidden" name="_subject" value="New message from portfolio">

      <button type="submit" class="contact-btn">Send message</button>
    </form>

  </section>

</body>
</html>
