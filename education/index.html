<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Education — Sebastián Valentín Candelario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#020617;
      --bg-soft:#0b1220;
      --accent:#16a34a;
      --accent-2:#22c55e;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --radius:14px;
    }

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:radial-gradient(circle at top,#052e16 0,#020617 55%);
      color:var(--text);
    }

    /* NAVBAR (estilo dark como Home y Experience) */
    nav{
      width:100%;
      padding:14px 18px;
      background:rgba(2,6,23,0.92);
      backdrop-filter:blur(12px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      border-bottom:1px solid rgba(148,163,184,0.25);
      position:sticky;
      top:0;
      z-index:20;
      box-sizing:border-box;
    }

    nav .brand{
      font-weight:800;
      font-size:20px;
      color:var(--accent-2);
      text-shadow:0 0 8px rgba(34,197,94,0.4);
    }

    nav .links{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }

    nav .links a{
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:6px 12px;
      border-radius:999px;
      font-size:14px;
      transition:0.2s ease;
    }

    nav .links a:hover{
      background:rgba(34,197,94,0.15);
      color:var(--text);
    }

    /* PAGE TITLE */
    h1{
      font-size:34px;
      font-weight:800;
      color:var(--accent-2);
      text-align:center;
      margin-top:50px;
      text-shadow:0 0 12px rgba(34,197,94,0.45);
    }

    /* Responsiveness */
    @media (max-width: 768px) {
      nav {
        padding:10px 14px;
        align-items:flex-start;
      }

      nav .brand {
        margin-bottom:6px;
        font-size:18px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="brand">Sebastián Valentín Candelario</div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/about-me/">About Me</a>
      <a href="/education/">Education</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </div>
  </nav>

  <!-- PAGE TITLE -->
  <h1>Education</h1>

  <!-- PAGE CONTENT -->
  <p style="text-align:center; margin-top:40px; font-size:22px; color:var(--muted);">
    This section is in progress. New content will be added soon :)
  </p>

</body>
</html>
