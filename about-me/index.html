<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About Me — Sebastián Valentín Candelario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6fbf8;
      --card:#ffffff;
      --accent:#16a34a;
      --accent-2:#059669;
      --muted:#5b6b68;
      --shadow:0 6px 24px rgba(0,0,0,0.08);
      --radius:14px;
    }
    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:var(--bg);
      color:#0f1724;
    }
    .container{
      max-width:1100px;
      margin:60px auto;
      padding:32px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    h1{
      font-size:36px;
      font-weight:800;
      color:#053322;
      margin-bottom:20px;
      text-align:center;
    }
    .about-grid{
      display:grid;
      grid-template-columns:280px 1fr;
      gap:32px;
      align-items:center;
    }
    .photo{
      width:100%;
      border-radius:999px;
      overflow:hidden;
      border:4px solid rgba(5,150,105,0.15);
    }
    .photo img{
      width:100%;
      display:block;
    }
    .description p{
      font-size:16px;
      line-height:1.6;
      color:var(--muted);
    }
    .skills{
      margin-top:20px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .skill{
      background:rgba(5,150,105,0.08);
      padding:8px 14px;
      border-radius:999px;
      color:var(--accent-2);
      font-weight:600;
      font-size:14px;
    }
    @media(max-width:800px){
      .about-grid{
        grid-template-columns:1fr;
        text-align:center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>About Me</h1>
    <div class="about-grid">
      <div class="photo">
        <!-- Cambia la ruta de la imagen -->
        <img src="your-photo.jpg" alt="Sebastián Valentín Candelario">
      </div>
      <div class="description">
        <p>
          This section is in progress. New content will be added soon :)
        </p>
        <div class="skills">
          <span class="skill">Process simulation</span>
          <span class="skill">Mass & energy balances</span>
          <span class="skill">Sustainable energy</span>
          <span class="skill">Environmental assessment</span>
          <span class="skill">Energy efficiency</span>
          <span class="skill">Python / MATLAB</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
